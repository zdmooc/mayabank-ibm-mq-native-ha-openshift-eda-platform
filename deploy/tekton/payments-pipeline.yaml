apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-payments
  namespace: mayabank-mq-build
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-payments-build
  namespace: mayabank-mq-build
rules:
  - apiGroups: [build.openshift.io]
    resources: [buildconfigs, builds, builds/log]
    verbs: [get, list, watch]
  - apiGroups: [build.openshift.io]
    resources: [buildconfigs/instantiate, buildconfigs/instantiatebinary]
    verbs: [create]
  - apiGroups: [image.openshift.io]
    resources: [imagestreams, imagestreamtags]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-payments-build
  namespace: mayabank-mq-build
subjects:
  - kind: ServiceAccount
    name: tekton-payments
    namespace: mayabank-mq-build
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-payments-build
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: payments-ci-build
  namespace: mayabank-mq-build
spec:
  params:
    - name: git-url
      type: string
      default: https://github.com/zdmooc/mayabank-ibm-mq-native-ha-openshift-eda-platform.git
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:2.47.2
      workingDir: $(workspaces.source.path)
      env:
        - name: HOME
          value: /tekton/home
      script: |
        #!/bin/sh
        set -eu
        rm -rf repo
        git clone --depth=1 --branch "$(params.revision)" "$(params.git-url)" repo
    - name: unit-tests
      image: maven:3.9.9-eclipse-temurin-17
      workingDir: $(workspaces.source.path)
      env:
        - name: HOME
          value: /tekton/home
      script: |
        #!/bin/sh
        set -eu
        cd repo/apps/payments
        mvn -B -ntp test
    - name: source-security-scan
      image: aquasec/trivy:0.58.1
      workingDir: $(workspaces.source.path)
      env:
        - name: HOME
          value: /tekton/home
        - name: TRIVY_CACHE_DIR
          value: /tmp/trivy
      script: |
        #!/bin/sh
        set -eu
        cd repo
        trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
    - name: openshift-build
      image: quay.io/openshift/origin-cli:4.22
      workingDir: $(workspaces.source.path)
      env:
        - name: HOME
          value: /tekton/home
      script: |
        #!/bin/sh
        set -eu
        cd repo
        oc -n mayabank-mq-build start-build payments --from-dir=apps/payments --follow --wait
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: payments-ci
  namespace: mayabank-mq-build
spec:
  params:
    - name: git-url
      type: string
      default: https://github.com/zdmooc/mayabank-ibm-mq-native-ha-openshift-eda-platform.git
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  tasks:
    - name: build-test-scan
      taskRef:
        name: payments-ci-build
      params:
        - name: git-url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
