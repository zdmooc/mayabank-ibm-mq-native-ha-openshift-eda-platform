# TEMPLATE ONLY — requires External Secrets Operator and a configured Vault instance.
# Replace example.invalid, mountPath, role and remote keys before use.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: mayabank-vault
  namespace: mayabank-mq-prod
spec:
  provider:
    vault:
      server: https://vault.example.invalid
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: mayabank-mq
          serviceAccountRef:
            name: payment-processing
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payment-processing-mq-tls
  namespace: mayabank-mq-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mayabank-vault
    kind: SecretStore
  target:
    name: payment-processing-mq-tls
    creationPolicy: Owner
  data:
    - secretKey: client.p12
      remoteRef:
        key: mayabank/mq/payment-processing
        property: client.p12
    - secretKey: trust.p12
      remoteRef:
        key: mayabank/mq/payment-processing
        property: trust.p12
    - secretKey: keystore-password
      remoteRef:
        key: mayabank/mq/payment-processing
        property: keystore-password
    - secretKey: truststore-password
      remoteRef:
        key: mayabank/mq/payment-processing
        property: truststore-password
